<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GTDB Visualizations</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 10px 20px; /* reduce top/bottom padding */
    }

    h1 {
        text-align: center;
        margin: 10px 0 20px 0; /* less top and bottom margin */
    }
    .grid-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-gap: 20px;
    }
    .grid-item {
        position: relative;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        overflow: hidden;
        transition: transform 0.2s;
        background-color: #fff;
    }
    .grid-item:hover {
        transform: scale(1.05);
    }
    .grid-item a {
        display: block;
        text-decoration: none;
        padding: 0;
        color: inherit;
        position: relative;
    }
    .grid-item img {
        width: 100%;
        max-height: 190px;
        object-fit: contain;
        display: block;
        margin: 10px auto 0;
    }
    .grid-item .overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(255,255,255,0.2);
        backdrop-filter: blur(4px);
        transition: opacity 0.2s;
        z-index: 1;
    }
    .grid-item:hover .overlay {
        opacity: 0;
    }
    .grid-item .title {
        position: absolute;
        top: 5px;
        left: 50%;
        transform: translateX(-50%);
        color: rgb(0, 0, 0);
        text-shadow: 2px 2px 4px rgb(127, 127, 127);
        font-weight: bold;
        font-size: 18px;
        padding: 2px 6px;
        margin: 0;
        background-color: rgba(0, 0, 0, 0.0); /* semi-transparent black box */
        border-radius: 4px;
        white-space: nowrap;
        z-index: 2;
        text-align: center;
    }
    #viewer {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: white;
        z-index: 9999;
    }
    #viewer iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
    #backButton {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 10000;
        padding: 10px 20px;
        background: #333;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }
    </style>
</head>
<body>

<h1>GTDB Visualizations</h1>

<div id="dashboard" class="grid-container"></div>

<div id="viewer">
    <button id="backButton">← Back to Dashboard</button>
    <iframe id="viewerFrame"></iframe>
</div>

<script>
const htmlFiles = [
    "3d.html",
    "c_and_c.html",
    "density.html",
    "gc_by_phylum_ordered_gc.html",
    "heterogeneity.html",
    "level.html",
    "l_n_50.html",
    "mag_qual.html",
    "ncbi_time.html",
    "size_prot.html",
    "source.html",
    "ssu_count.html",
    "treemap.html",
    "typestrains.html",
    "worldmap.html"
];

const titles = [
    "Completeness vs Heterogeneity vs Contamination",
    "Genome Size vs GC Content",
    "Coding Density vs Genome Size",
    "GC Content Distribution by Phylum",
    "Completeness vs Heterogeneity",
    "Distribution of NCBI Genome Assembly Levels",
    "N50 / L50 Distribution",
    "Genome MAG Quality",
    "Genomes Sequenced Over Time",
    "Protein Count vs Genome Size",
    "Isolation Source Categories",
    "SSU vs LSU Counts",
    "GTDB Taxonomic Abundance (Genus level)",
    "Proportion of GTDB Rep / NCBI Type Material",
    "GTDB Genome Counts by Country"
];

const dashboard = document.getElementById('dashboard');
const viewer = document.getElementById('viewer');
const viewerFrame = document.getElementById('viewerFrame');
const backButton = document.getElementById('backButton');

// Append GTDB chart tiles
htmlFiles.forEach((file, index) => {
    const gridItem = document.createElement('div');
    gridItem.className = 'grid-item';

    const a = document.createElement('a');
    a.href = "#";
    a.dataset.html = file;

    const img = document.createElement('img');
    const baseName = file.replace('.html','');
    img.src = `${baseName}.png`;
    img.alt = titles[index];  // friendly title
    img.onerror = () => { img.src = 'placeholder.png'; };

    const overlay = document.createElement('div');
    overlay.className = 'overlay';

    a.appendChild(img);
    a.appendChild(overlay);

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = titles[index];

    gridItem.appendChild(a);
    gridItem.appendChild(title);
    dashboard.appendChild(gridItem);

    a.addEventListener('click', e => {
        e.preventDefault();
        viewerFrame.src = file;
        dashboard.style.display = 'none';
        viewer.style.display = 'block';
    });
});

// Append Edgar login as the 16th tile
const edgarCell = document.createElement('div');
edgarCell.className = 'grid-item';

const edgarLink = document.createElement('a');
edgarLink.href = "https://edgar3.computational.bio.uni-giessen.de";
edgarLink.target = "_blank";

const edgarImg = document.createElement('img');
edgarImg.src = "edgar_login.png";
edgarImg.alt = "Link to our service EDGAR";
edgarImg.onerror = () => { edgarImg.src = 'placeholder.png'; };

const overlay = document.createElement('div');
overlay.className = 'overlay';

edgarLink.appendChild(edgarImg);
edgarLink.appendChild(overlay);

edgarCell.appendChild(edgarLink);

const edgarTitle = document.createElement('div');
edgarTitle.className = 'title';
edgarTitle.textContent = "Link to our service EDGAR";
edgarCell.appendChild(edgarTitle);

dashboard.appendChild(edgarCell);

// Back button
backButton.addEventListener('click', () => {
    viewer.style.display = 'none';
    dashboard.style.display = 'grid';
    viewerFrame.src = "";
});
</script>

</body>
</html>
